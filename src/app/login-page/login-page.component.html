<ion-content>
  <main class="login-page">
    <section class="login-card">
      <img class="brand-icon" src="assets/icon/salarium-icon-source.png" alt="Ícone SalariuM">
      <p class="eyebrow">SalariuM</p>
      <h1>Bem-vindo</h1>
      <p class="subtitle">Entre para acompanhar as suas finanças.</p>

      <form [formGroup]="signInForm" (ngSubmit)="signIn()">
        <label>
          <span>Usuário</span>
          <input type="text" formControlName="username" autocomplete="username" placeholder="Seu usuário">
        </label>
        <label>
          <span>Senha</span>
          <div class="password-field">
            <input
              [type]="isPasswordVisible ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              placeholder="Sua senha"
            >
            <button
              type="button"
              class="password-toggle"
              [attr.aria-label]="isPasswordVisible ? 'Ocultar senha' : 'Mostrar senha'"
              (click)="togglePasswordVisibility()"
            >
              <ion-icon [name]="isPasswordVisible ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </label>

        @if (errorMessage) {
          <p class="error-message">{{ errorMessage }}</p>
        }

        <button type="submit" class="sign-in-button" [disabled]="isSigningIn">
          <ion-icon name="lock-closed-outline"></ion-icon>
          {{ isSigningIn ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>

      <a class="register-link" routerLink="/register">Criar conta</a>

      @if (isGoogleConfigured) {
        <div class="divider"><span>ou</span></div>
        <div #googleButton class="google-button"></div>
      }
    </section>
  </main>
</ion-content>
