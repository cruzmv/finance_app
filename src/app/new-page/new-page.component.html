<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refreshMovimentOptions($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <form class="moviment-form-page" [formGroup]="movimentForm" (ngSubmit)="saveMoviment()">
    <header class="form-header">
      <button type="button" class="header-action" aria-label="Cancelar" (click)="cancel()">
        <ion-icon name="close-outline"></ion-icon>
      </button>
      <h1>{{ pageTitle }}</h1>
      <button
        type="submit"
        class="header-action save-action"
        aria-label="Guardar movimento"
        [disabled]="isSaving || isLoading"
      >
        <ion-icon name="checkmark-outline"></ion-icon>
      </button>
    </header>

    @if (errorMessage) {
      <p class="form-error">{{ errorMessage }}</p>
    }

    <div class="movement-type-switch" aria-label="Tipo de movimento">
      <button
        type="button"
        class="type-button expense"
        [class.active]="valueSign === -1"
        [attr.aria-pressed]="valueSign === -1"
        (click)="setValueSign(-1)"
      >
        Despesa
      </button>
      <button
        type="button"
        class="type-button income"
        [class.active]="valueSign === 1"
        [attr.aria-pressed]="valueSign === 1"
        (click)="setValueSign(1)"
      >
        Entrada
      </button>
    </div>

    <label class="amount-field">
      <span aria-hidden="true">€</span>
      <input
        type="number"
        formControlName="value"
        step="0.01"
        inputmode="decimal"
        min="0"
        placeholder="0,00"
        aria-label="Valor"
      />
    </label>

    <label class="form-field">
      <span>Descrição</span>
      <input type="text" formControlName="description" placeholder="Descrição do movimento" />
    </label>

    <label class="form-field">
      <span>Categoria</span>
      <div class="select-shell">
        <ion-icon class="field-leading-icon expense-icon" name="cart-outline"></ion-icon>
        <select formControlName="ledgerAccountId" aria-label="Categoria">
          @for (ledger of ledgerAccounts; track ledger.id) {
            <option [ngValue]="ledger.id">{{ ledger.name }}</option>
          }
        </select>
        <ion-icon class="field-trailing-icon" name="chevron-forward-outline"></ion-icon>
      </div>
    </label>

    <label class="form-field">
      <span>Conta</span>
      <div class="select-shell">
        <ion-icon class="field-leading-icon" name="card-outline"></ion-icon>
        <select formControlName="movimentAccountId" aria-label="Conta">
          @for (account of movimentAccounts; track account.id) {
            <option [ngValue]="account.id">{{ account.name }}</option>
          }
        </select>
        <ion-icon class="field-trailing-icon" name="chevron-forward-outline"></ion-icon>
      </div>
    </label>

    <label class="form-field">
      <span>Data</span>
      <div class="date-shell">
        <input type="datetime-local" formControlName="datetime" aria-label="Data" />
        <ion-icon class="field-trailing-icon" name="calendar-outline"></ion-icon>
      </div>
    </label>

    <section class="form-section">
      <span class="section-label">Status</span>
      <div class="status-switch">
        @for (status of statusList; track status.id) {
          <button
            type="button"
            class="status-button"
            [class.active]="movimentForm.controls.statusId.value === status.id"
            (click)="selectStatus(status)"
          >
            {{ status.name }}
          </button>
        }
      </div>
    </section>

    <section class="receipt-scanner">
      <span class="receipt-label">Adicionar recibo</span>
      <input
        #receiptInput
        type="file"
        accept="image/*"
        capture="environment"
        class="receipt-input"
        (change)="onReceiptSelected($event)"
      />
      <button type="button" class="scan-button" [disabled]="isAnalyzingReceipt" (click)="openReceiptCapture()">
        <ion-icon name="camera-outline"></ion-icon>
        {{ isAnalyzingReceipt ? 'A analisar recibo...' : 'Tirar foto do recibo' }}
      </button>

      @if (receiptImagePreview) {
        <img class="receipt-preview" [src]="receiptImagePreview" alt="Pré-visualização do recibo" />
      }

      @if (receiptMessage) {
        <p class="scan-message">{{ receiptMessage }}</p>
      }
    </section>
  </form>
</ion-content>
