<ion-tabs>
  @if (isFinanceRouteLoading) {
    <div class="route-loading-overlay" role="status" aria-live="polite">
      <div class="route-loading-panel">
        <ion-spinner name="crescent"></ion-spinner>
        <span>Loading finance...</span>
      </div>
    </div>
  }

  @if (!isSetupRoute) {
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="dashboard">
      <span class="nav-icon home-icon" aria-hidden="true"></span>
      <span class="tab-label">Início</span>
    </ion-tab-button>
    <ion-tab-button tab="finance" class="wide-label-tab">
      <span class="nav-icon movements-icon" aria-hidden="true"></span>
      <span class="tab-label finance-label">Movimentos</span>
    </ion-tab-button>
    <ion-tab-button tab="new" class="add-tab" aria-label="Novo movimento" (click)="openNewMovement($event)">
      <span class="add-button">
        <span class="add-glyph" aria-hidden="true"></span>
      </span>
    </ion-tab-button>
    <ion-tab-button tab="reports" class="wide-label-tab">
      <span class="nav-icon reports-icon" aria-hidden="true"></span>
      <span class="tab-label reports-label">Relatório</span>
    </ion-tab-button>
    <ion-tab-button tab="settings">
      <span class="nav-icon more-icon" aria-hidden="true"></span>
      <span class="tab-label">Mais</span>
    </ion-tab-button>
  </ion-tab-bar>
  }
</ion-tabs>
