<ion-tabs>
  @if (isFinanceRouteLoading) {
    <div class="route-loading-overlay" role="status" aria-live="polite">
      <div class="route-loading-panel">
        <ion-spinner name="crescent"></ion-spinner>
        <span>Loading finance...</span>
      </div>
    </div>
  }

  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="dashboard">
      <ion-icon name="home-outline"></ion-icon>
      Início
    </ion-tab-button>
    <ion-tab-button tab="finance">
      <ion-icon name="receipt-outline"></ion-icon>
      Movimentos
    </ion-tab-button>
    <ion-tab-button tab="new" class="add-tab" aria-label="Novo movimento">
      <span class="add-button">
        <ion-icon name="add-outline"></ion-icon>
      </span>
    </ion-tab-button>
    <ion-tab-button tab="planning">
      <ion-icon name="calendar-clear-outline"></ion-icon>
      Planejamento
    </ion-tab-button>
    <ion-tab-button tab="settings">
      <ion-icon name="ellipsis-horizontal-outline"></ion-icon>
      Mais
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
