<ion-content>
  <main class="register-page">
    <section class="register-card">
      <img class="brand-icon" src="assets/icon/salarium-icon-source.png" alt="Ícone SalariuM">
      <p class="eyebrow">SalariuM</p>
      <h1>Criar conta</h1>
      <p class="subtitle">Comece seu espaço financeiro.</p>

      <form [formGroup]="registerForm" (ngSubmit)="register()">
        <label>
          <span>Email</span>
          <input type="email" formControlName="email" autocomplete="email" placeholder="nome@exemplo.com">
        </label>
        <label>
          <span>Usuário</span>
          <input type="text" formControlName="username" autocomplete="username" placeholder="Escolha um usuário">
        </label>
        <label>
          <span>Senha</span>
          <div class="password-field">
            <input
              [type]="isPasswordVisible ? 'text' : 'password'"
              formControlName="password"
              autocomplete="new-password"
              placeholder="Mínimo de 8 caracteres"
            >
            <button
              type="button"
              class="password-toggle"
              [attr.aria-label]="isPasswordVisible ? 'Ocultar senha' : 'Mostrar senha'"
              (click)="togglePasswordVisibility()"
            >
              <ion-icon [name]="isPasswordVisible ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </label>
        @if (errorMessage) {
          <p class="error-message">{{ errorMessage }}</p>
        }

        <button type="submit" class="register-button" [disabled]="isRegistering">
          <ion-icon name="person-add-outline"></ion-icon>
          {{ isRegistering ? 'Criando...' : 'Criar conta' }}
        </button>
      </form>

      <a class="login-link" routerLink="/login">Já tenho uma conta</a>
    </section>
  </main>
</ion-content>
